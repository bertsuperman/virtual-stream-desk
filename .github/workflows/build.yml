name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test Core
        run: dotnet run --project tests/VirtualStreamDeck.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/VirtualStreamDeck.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualStreamDeck-win-x64
          path: publish/VirtualStreamDeck.exe
