name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test Core
        run: dotnet run --project tests/VirtualStreamDeck.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/VirtualStreamDeck.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=0.2.${{ github.run_number }}
          -o publish

      # Read by the app's self-update: line 1 version, line 2 SHA-256 of the exe.
      - name: Write version.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/VirtualStreamDeck.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "0.2.${{ github.run_number }}`n$hash" | Set-Content publish/version.txt -NoNewline -Encoding ascii
          Get-Content publish/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualStreamDeck-win-x64
          path: |
            publish/VirtualStreamDeck.exe
            publish/version.txt

      - name: Update "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest publish/VirtualStreamDeck.exe publish/version.txt `
            --prerelease `
            --target ${{ github.sha }} `
            --title "Najnovšia verzia 0.2.${{ github.run_number }}" `
            --notes "Automaticky zostavené z commitu ${{ github.sha }}. Stiahni VirtualStreamDeck.exe a spusti. Ak beží staršia verzia, nová ju sama nahradí. Od tejto verzie sa Stream Deck vie aktualizovať aj sám (zelená šípka alebo Nastavenia → Všeobecné)."
