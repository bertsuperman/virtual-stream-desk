<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stream Deck">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/app.png">
<link rel="apple-touch-icon" href="/app.png">
<title>Stream Deck</title>
<style>
  :root {
    --bg: #17171a; --tile: #26262c; --tile-hi: #34343c; --text: #e6e6eb; --muted: #8a8a94;
    --accent: #4c8dff; --error: #e5484d; --ok: #46c46e; --gap: 10px; --size: 80px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  body { overflow: hidden; }
  /* The whole app lives in #app. Held upright, it is rotated 90° so the deck is always landscape. */
  #app {
    position: fixed; left: 0; top: 0; width: var(--app-w, 100vw); height: var(--app-h, 100vh);
    display: flex; flex-direction: row; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body.rotated #app { transform-origin: 0 0; transform: translateX(var(--vw)) rotate(90deg); padding: 0; }
  /* Rail on the left, like the PC app: connection, profile, rotate, full screen */
  #rail {
    width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0 10px;
    background: #1c1c21; border-right: 1px solid #2a2a30;
  }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; transition: background .2s; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--error); }
  /* Profile: name in the rail; with more profiles an invisible <select> on top opens the native picker */
  #profile-btn {
    position: relative; width: 54px; margin-top: 6px; padding: 7px 3px 6px; border-radius: 10px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text);
  }
  #profile-btn.many { background: var(--tile); }
  #profile-btn .ico { font-size: 18px; line-height: 1; }
  #pname {
    font-size: 11px; font-weight: 600; line-height: 1.2; max-width: 50px; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #profile-btn .more { font-size: 9px; color: var(--muted); line-height: 1; }
  #profile { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; }
  .spacer { flex: 1; }
  .icon-btn { background: none; border: 0; color: var(--muted); font-size: 20px; width: 42px; height: 42px; border-radius: 10px; }
  .icon-btn:active { background: var(--tile); }
  /* "Add to home screen" hint (only in the browser, not in the home-screen app) */
  #hint {
    display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 9px 8px 9px 14px; border-radius: 12px;
    background: #1f2a40; border: 1px solid #2f4470; color: #cfe0ff; font-size: 13px; flex: none;
  }
  #hint[hidden] { display: none; }
  #hint-text { flex: 1; }
  #hint b { color: #fff; }
  #hint-close { background: none; border: 0; color: #9fb7e8; font-size: 18px; width: 34px; height: 34px; border-radius: 8px; flex: none; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 12px 12px; touch-action: none; min-height: 0; }
  #grid { display: grid; gap: var(--gap); grid-template-columns: repeat(var(--cols), var(--size)); grid-auto-rows: var(--size); }
  .tile {
    position: relative; border-radius: calc(var(--size) * .16); background: var(--tile); display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; border: 2px solid transparent;
    transition: transform .12s ease-out, background .2s, border-color .2s;
  }
  .tile.empty { background: #1d1d21; }
  .tile.down { transform: scale(.92); background: var(--tile-hi); }
  .tile.ok { border-color: var(--accent); }
  .tile.err { border-color: var(--error); }
  .tile img { width: 60%; height: 60%; object-fit: contain; pointer-events: none; }
  .tile.lbl img { width: 48%; height: 48%; margin-top: 4%; }
  .tile .emoji { font-size: calc(var(--size) * .38); line-height: 1; pointer-events: none; }
  .tile.lbl .emoji { font-size: calc(var(--size) * .3); }
  .tile .label {
    max-width: 92%; font-size: max(10px, calc(var(--size) * .135)); margin-top: 6%; text-align: center; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile .label.big { white-space: normal; font-weight: 600; font-size: max(11px, calc(var(--size) * .16)); margin: 0; line-height: 1.15;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 32px;
    background: rgba(23,23,26,.92); z-index: 10; flex-direction: column; gap: 12px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { font-size: 20px; margin: 0; }
  #overlay p { color: var(--muted); margin: 0; max-width: 340px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 40px); opacity: 0;
    background: #3a1d1f; color: #ffd7d8; border: 1px solid var(--error); padding: 10px 14px; border-radius: 12px; max-width: 90vw;
    transition: transform .2s, opacity .2s; z-index: 20; pointer-events: none;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div id="app">
<nav id="rail">
  <span class="dot" id="dot"></span>
  <div id="profile-btn">
    <span class="ico">📂</span>
    <span id="pname">Stream Deck</span>
    <span class="more" hidden>▼</span>
    <select id="profile" hidden></select>
  </div>
  <span class="spacer"></span>
  <button class="icon-btn" id="rot">⟲</button>
  <button class="icon-btn" id="fs">⛶</button>
</nav>
<div class="content">
  <div id="hint" hidden><span id="hint-text"></span><button id="hint-close" aria-label="OK">✕</button></div>
  <main><div id="grid"></div></main>
</div>
<div id="overlay"><h1 id="ov-title"></h1><p id="ov-text"></p></div>
<div id="toast"></div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const grid = $("grid"), dot = $("dot"), profileSel = $("profile"), pname = $("pname");

  // The token comes from the QR code (?t=…). Remember it and remove it from the address bar.
  const params = new URLSearchParams(location.search);
  if (params.get("t")) {
    try { localStorage.setItem("vsd-token", params.get("t")); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }
  let token = params.get("t");
  try { token = token || localStorage.getItem("vsd-token"); } catch (e) {}

  let ws = null, deck = null, seq = 0, retry = 0, retryTimer = null;
  const pending = new Map();

  // ───────── language (the PC sends it; <html lang> is set by the server) ─────────
  let lang = document.documentElement.lang === "en" ? "en" : "sk";
  const T = (sk, en) => lang === "en" ? en : sk;
  function applyLang() {
    document.documentElement.lang = lang;
    for (const [id, sk, en] of [["rot", "Na šírku / na výšku", "Landscape / portrait"], ["fs", "Celá obrazovka", "Full screen"],
                                ["profile", "Profil", "Profile"]]) {
      $(id).title = T(sk, en);
      $(id).setAttribute("aria-label", T(sk, en));
    }
    $("hint-text").innerHTML = hintHtml();
  }

  // ───────── "add to home screen" = full screen ─────────
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  function hintHtml() {
    return ios
      ? T("Pre celú obrazovku si daj deck na plochu: <b>Zdieľať ⬆︎ → Pridať na plochu</b> a otváraj ho odtiaľ.",
          "For full screen, add the deck to your home screen: <b>Share ⬆︎ → Add to Home Screen</b> and open it from there.")
      : T("Pre celú obrazovku si daj deck na plochu: <b>⋮ → Pridať na plochu</b> a otváraj ho odtiaľ.",
          "For full screen, add the deck to your home screen: <b>⋮ → Add to Home screen</b> and open it from there.");
  }
  function showHint(show) {
    $("hint").hidden = !show;
    if (deck) layout();
  }
  let hintDismissed = false;
  try { hintDismissed = localStorage.getItem("vsd-hint") === "0"; } catch (e) {}
  $("hint-close").addEventListener("click", () => {
    try { localStorage.setItem("vsd-hint", "0"); } catch (e) {}
    showHint(false);
  });
  applyLang();
  overlay(T("Pripájam…", "Connecting…"));

  function overlay(titleText, text) {
    $("ov-title").textContent = titleText;
    $("ov-text").textContent = text || "";
    $("overlay").classList.toggle("show", !!titleText);
  }

  let toastTimer = null;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
  }

  function setStatus(state) {
    dot.className = "dot " + (state === "on" ? "on" : state === "off" ? "off" : "");
  }

  async function connect() {
    clearTimeout(retryTimer);
    if (!token) {
      overlay(T("Naskenuj QR kód", "Scan the QR code"),
        T("Otvor na PC Stream Deck → Nastavenia → Mobil a naskenuj QR kód.", "On the PC open Stream Deck → Settings → Phone and scan the QR code."));
      return;
    }
    if (ws && ws.readyState <= 1) return;
    try {
      const r = await fetch("/api/ping?t=" + encodeURIComponent(token), { cache: "no-store" });
      if (r.status === 401) {
        setStatus("off");
        overlay(T("Neplatný QR kód", "Invalid QR code"),
          T("Kód bol medzitým zmenený. Naskenuj nový v Stream Decku → Nastavenia → Mobil.", "The code has been changed. Scan the new one in Stream Deck → Settings → Phone."));
        return;
      }
    } catch (e) {
      return scheduleRetry();
    }

    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + "/ws?t=" + encodeURIComponent(token));
    ws.onopen = () => { retry = 0; setStatus("on"); overlay(null); };
    ws.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.type === "deck") {
        deck = msg;
        if (msg.lang && msg.lang !== lang) { lang = msg.lang; applyLang(); }
        render();
      }
      else if (msg.type === "result") onResult(msg);
    };
    ws.onclose = () => { setStatus("off"); scheduleRetry(); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  function scheduleRetry() {
    setStatus("off");
    if (!deck) overlay(T("Pripájam…", "Connecting…"),
      T("Hľadám Stream Deck v sieti. PC aj mobil musia byť v rovnakej Wi-Fi.", "Looking for Stream Deck on the network. The PC and the phone must be on the same Wi-Fi."));
    const delay = [500, 1000, 2000, 4000][Math.min(retry++, 3)];
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, delay);
  }

  // ───────── rendering ─────────

  function layout() {
    if (!deck) return;
    const main = grid.parentElement;
    const gap = 10;
    const w = main.clientWidth - 24, h = main.clientHeight - 20; // un-rotated sizes, also when #app is rotated
    const size = Math.floor(Math.min(
      (w - gap * (deck.columns - 1)) / deck.columns,
      (h - gap * (deck.rows - 1)) / deck.rows,
      180));
    grid.style.setProperty("--size", Math.max(size, 36) + "px");
    grid.style.setProperty("--cols", deck.columns);
  }

  function render() {
    // Profiles
    const profiles = deck.profiles || [];
    const many = profiles.length > 1;
    profileSel.hidden = !many;
    $("profile-btn").classList.toggle("many", many);
    document.querySelector("#profile-btn .more").hidden = !many;
    profileSel.innerHTML = "";
    for (const p of profiles) {
      const o = document.createElement("option");
      o.value = p.id; o.textContent = p.name;
      if (p.id === deck.activeProfile) o.selected = true;
      profileSel.appendChild(o);
    }
    const active = profiles.find(p => p.id === deck.activeProfile) || profiles[0];
    pname.textContent = active ? active.name : "Stream Deck";

    // Grid
    const byCell = new Map(deck.buttons.map(b => [b.row + ":" + b.col, b]));
    grid.innerHTML = "";
    for (let r = 0; r < deck.rows; r++) {
      for (let c = 0; c < deck.columns; c++) {
        const b = byCell.get(r + ":" + c);
        const tile = document.createElement("div");
        tile.className = "tile";
        if (!b) { tile.classList.add("empty"); grid.appendChild(tile); continue; }

        tile.dataset.id = b.id;
        const hasLabel = !!b.label;
        const labelBelow = hasLabel && deck.showLabels;
        if (labelBelow) tile.classList.add("lbl");

        if (b.icon) {
          const img = document.createElement("img");
          img.src = b.icon + "?t=" + encodeURIComponent(token);
          img.alt = "";
          tile.appendChild(img);
        } else if (hasLabel && !deck.showLabels) {
          const l = document.createElement("div");
          l.className = "label big";
          l.textContent = b.label;
          tile.appendChild(l);
        } else {
          const e = document.createElement("div");
          e.className = "emoji";
          e.textContent = b.emoji || "▫️";
          tile.appendChild(e);
        }
        if (labelBelow) {
          const l = document.createElement("div");
          l.className = "label";
          l.textContent = b.label;
          tile.appendChild(l);
        }
        grid.appendChild(tile);
      }
    }
    layout();
  }

  // ───────── pressing ─────────

  grid.addEventListener("pointerdown", e => {
    const tile = e.target.closest(".tile[data-id]");
    if (!tile) return;
    e.preventDefault();
    tile.classList.add("down");
    if (navigator.vibrate) navigator.vibrate(12);
    if (!ws || ws.readyState !== 1) { toast(T("Nie som pripojený k PC.", "Not connected to the PC.")); return; }
    const id = ++seq;
    pending.set(id, tile);
    ws.send(JSON.stringify({ type: "press", id: tile.dataset.id, seq: id }));
  });
  const release = () => grid.querySelectorAll(".tile.down").forEach(t => t.classList.remove("down"));
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => grid.addEventListener(ev, release));

  function onResult(msg) {
    const tile = pending.get(msg.seq) || grid.querySelector(`.tile[data-id="${CSS.escape(msg.id)}"]`);
    pending.delete(msg.seq);
    if (!tile) return;
    const cls = msg.ok ? "ok" : "err";
    tile.classList.add(cls);
    setTimeout(() => tile.classList.remove(cls), msg.ok ? 250 : 1500);
    if (!msg.ok) {
      toast(msg.error || T("Akcia zlyhala.", "The action failed."));
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    }
  }

  profileSel.addEventListener("change", () => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "profile", id: profileSel.value }));
  });

  // ───────── misc ─────────

  // ───────── always landscape ─────────
  // Held upright, the app is drawn rotated by 90°, so you just turn the phone. In full screen
  // (Android) the real orientation is locked to landscape and no rotation is needed.
  let autoLandscape = true;
  try { autoLandscape = localStorage.getItem("vsd-landscape") !== "0"; } catch (e) {}

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const rotate = autoLandscape && vh > vw;
    document.body.classList.toggle("rotated", rotate);
    const root = document.documentElement.style;
    root.setProperty("--vw", vw + "px");
    root.setProperty("--app-w", (rotate ? vh : vw) + "px");
    root.setProperty("--app-h", (rotate ? vw : vh) + "px");
    layout();
  }

  function lockLandscape() {
    if (autoLandscape && screen.orientation && screen.orientation.lock)
      screen.orientation.lock("landscape").catch(() => {});
  }

  $("rot").addEventListener("click", () => {
    autoLandscape = !autoLandscape;
    try { localStorage.setItem("vsd-landscape", autoLandscape ? "1" : "0"); } catch (e) {}
    if (!autoLandscape && screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch (e) {} }
    else lockLandscape();
    fit();
  });

  $("fs").addEventListener("click", () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().then(lockLandscape).catch(() => showHint(true));
    else showHint(true); // iPhone: only the home-screen app can be full screen
  });
  if (standalone) { $("fs").hidden = true; lockLandscape(); }
  else showHint(!hintDismissed);

  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 100));
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
  });

  fit();
  connect();
})();
</script>
</body>
</html>
